name: DSCIM Modular Library CI

on:
  workflow_dispatch:
    inputs:
      python-version:
        description: 'Python version to test'
        required: false
        default: '3.11'
        type: choice
        options:
          - '3.9'
          - '3.10'
          - '3.11'
          - '3.12'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.event.inputs.python-version)) || fromJSON('["3.9", "3.10", "3.11", "3.12"]') }}

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libhdf5-dev libnetcdf-dev
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        # Install core dependencies first
        pip install pytest pytest-cov
        pip install numpy pandas xarray scipy statsmodels
        # Install data format dependencies with fallbacks
        pip install pyyaml
        pip install h5py || echo "h5py installation failed, continuing..."
        pip install netcdf4 || echo "netcdf4 installation failed, continuing..."
        # Try zarr with numcodecs, fallback to zarr without numcodecs
        pip install zarr || (pip install --no-deps zarr && echo "zarr installed without numcodecs")
        # Install original DSCIM library for consistency tests
        pip install dscim
    
    - name: Install package
      run: pip install -e .
    
    - name: Verify dummy data
      run: |
        ls -la dummy_data/
        echo "Dummy data structure:"
        find dummy_data/ -type f | head -10
    
    - name: Run damage reduction consistency tests
      run: python -m pytest dscim_dev/tests/test_reduce_consistency.py -v --tb=short
    
    - name: Run damage function fitting tests
      run: python -m pytest dscim_dev/tests/test_damage_function_coefficient_fitting.py -v --tb=short
    
    - name: Run damage function consistency tests
      run: python -m pytest dscim_dev/tests/test_damage_function_coefficient_consistency.py -v --tb=short
    
    - name: Run complete test suite with coverage
      run: python -m pytest dscim_dev/tests/ -v --cov=dscim_dev --cov-report=term-missing
    
    - name: Integration test
      run: |
        python -c "
        from dscim_dev.io.data_loaders import load_real_dummy_data
        from dscim_dev.processing.core_operations import reduce_damages
        
        print('Testing complete workflow...')
        
        # Load data
        damage_data, economic_data = load_real_dummy_data()
        print(f'✓ Data loaded: {damage_data.dims}, {economic_data.dims}')
        
        # Test damage reduction
        result = reduce_damages(
            damage_data=damage_data,
            economic_data=economic_data['gdppc'],
            recipe='adding_up',
            reduction='cc'
        )
        print(f'✓ Damage reduction: {result.shape}')
        
        print('✓ Integration test passed!')
        " 