name: DSCIM Modular Library CI

on:
  push:
    branches: [ main, dscim-modular ]
  pull_request:
    branches: [ main, dscim-modular ]
  workflow_dispatch:  # Allows manual triggering

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, 3.10, 3.11, 3.12]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libhdf5-dev libnetcdf-dev
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        pip install xarray pandas numpy scipy statsmodels
        pip install zarr netcdf4 h5py
        pip install pyyaml pathlib
        
        # Install the package in development mode
        pip install -e .
    
    - name: Verify dummy data exists
      run: |
        ls -la dummy_data/
        echo "Dummy data structure:"
        find dummy_data/ -type f | head -10
    
    - name: Run damage reduction consistency tests
      run: |
        python -m pytest dscim_dev/tests/test_reduce_consistency.py -v --tb=short
    
    - name: Run damage function fitting tests
      run: |
        python -m pytest dscim_dev/tests/test_damage_function_coefficient_fitting.py -v --tb=short
    
    - name: Run damage function consistency tests
      run: |
        python -m pytest dscim_dev/tests/test_damage_function_coefficient_consistency.py -v --tb=short
    
    - name: Run complete test suite with coverage
      run: |
        python -m pytest dscim_dev/tests/ -v --cov=dscim_dev --cov-report=xml --cov-report=term-missing
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  integration-test:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install xarray pandas numpy scipy statsmodels
        pip install zarr netcdf4 h5py pyyaml pathlib
        pip install -e .
    
    - name: Run integration workflow test
      run: |
        python -c "
        from dscim_dev.io.data_loaders import load_real_dummy_data
        from dscim_dev.processing.core_operations import reduce_damages
        from dscim_dev.processing.damage_workflows import damage_function_workflow
        
        print('Testing complete workflow...')
        
        # Load data
        damage_data, economic_data = load_real_dummy_data()
        print(f'✓ Data loaded: {damage_data.dims}, {economic_data.dims}')
        
        # Test damage reduction
        result = reduce_damages(
            damage_data=damage_data,
            economic_data=economic_data['gdppc'],
            recipe='adding_up',
            reduction='cc'
        )
        print(f'✓ Damage reduction: {result.shape}')
        
        print('✓ Integration test passed!')
        " 